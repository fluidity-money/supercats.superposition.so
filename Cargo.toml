[package]
name = "superposition_supercats"
version = "0.1.2"
edition = "2024"

[lib]
name = "libsupercats"

[dependencies]
array-concat = { version = "0.5.5", default-features = false }
bobcat-sdk = { version = "0.11.9", features = ["panic-revert"] }
const-hex = { version = "1.19.3", default-features = false }
stylus-merkle-proof-verifier = { version = "0.1.1", default-features = false }

[dev-dependencies]
bobcat-sdk = { version = "0.11.9", features = ["panic-revert", "alloy-enabled", "serde"] }
const-hex = { version = "1.19.3", features = ["serde"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
